name: CV data

# A talk's status goes stale when its date passes, without any commit, so the
# check also runs weekly. GitHub turns the schedule off after 60 days without
# repository activity; re-enable it on the Actions tab.
on:
  push:
  pull_request:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@be3c7df29b3349ec6bcfc6b4792f1cf9f5237d18 # v1.343.0
        with:
          ruby-version: "3.4"
      - run: ruby scripts/test-check-cv-data.rb
      - run: ruby scripts/check-cv-data.rb
