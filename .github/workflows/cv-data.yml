name: CV data

# A talk's status goes stale when its date passes, without any commit, so the
# check also runs weekly. GitHub turns the schedule off after 60 days without
# repository activity; re-enable it on the Actions tab.
on:
  push:
  pull_request:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
      - run: ruby scripts/test-check-cv-data.rb
      - run: ruby scripts/check-cv-data.rb
