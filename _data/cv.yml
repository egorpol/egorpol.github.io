trajectory:
  - stage: Composition
    text: Classical and electroacoustic composition, fixed media, live electronics, and multichannel work
  - stage: Systems
    text: Max/MSP, OpenMusic, synthesis, hardware, and interactive analysis–synthesis workflows
  - stage: Realisation
    text: Studio teaching and the artistic-technical realisation of concerts, installations, and productions
  - stage: Computation
    text: Python, music encoding, reproducible audio and score analysis, and machine learning
  - stage: Current research
    text: Practice-informed computational musicology, open research software, infrastructure, and team leadership

competencies:
  - label: Composition and artistic practice
    text: Electroacoustic composition; fixed-media, live-electronic, multichannel, and installation formats; work across contemporary classical and electronic music
  - label: Synthesis and hardware
    text: Analogue and digital synthesis; hardware-based sound generation and processing; studio signal flow; multichannel routing; hybrid hardware/software setups
  - label: Interactive music systems
    text: Max/MSP and OpenMusic (Lisp); real-time audio, live electronics, algorithmic composition, and analysis–synthesis workflows
  - label: Concert, installation, and spatial-audio realisation
    text: Artistic-technical realisation, rehearsal and system setup, live electronics, multichannel and spatial-audio system design and operation, restoration, and stem mastering
  - label: Computational musicology
    text: Python, MEI/MusicXML, music21, and Verovio; corpus analysis, pattern discovery, and reproducible notebooks
  - label: Audio analysis and AI
    text: NumPy, SciPy, pandas, scikit-learn, librosa, and PyTorch; timbre, rhythm, structure, embeddings, and generative modelling
  - label: Teaching and studio leadership
    text: Research-led course design, project supervision, electroacoustic studio coordination, and technical mentoring
  - label: Research leadership and infrastructure
    text: Grant development, team supervision, open science, Docker, cloud services, and Jupyter4NFDI

experience:
  - dates: 2025–present
    role: Postdoctoral Researcher
    org: University of Music FRANZ LISZT Weimar
    location: Weimar
    bullets:
      - >-
        Serve as scientific co-lead of the DFG project
        *Development of a Comprehensive Cloud-Based Toolbox for Music Score Analysis*,
        alongside project head Prof. Dr. Martin Pfleiderer; responsible for scientific
        conception and research execution. Co-applicant; total funding: €443,458.
      - >-
        Coordinate the research programme and supervise doctoral candidates and
        student assistants across technical and scholarly work packages.
      - >-
        Develop Python workflows for MEI/MusicXML analysis, extend *mei-friend* for
        OMR corpora (*musiconn* / Denkmäler Deutscher Tonkunst), and deliver
        interactive score workflows through MEI, Verovio, and Jupyter4NFDI.
      - Integrate project methods into national research infrastructure and university teaching.

  - dates: 2013–2025
    role: Researcher and Artistic Associate
    org: University of Music and Theatre Leipzig
    location: Leipzig
    bullets:
      - >-
        Designed and taught courses in electroacoustics, popular and electronic
        music, computer-assisted analysis, and AI for musicology; supervised
        electroacoustic composition projects.
      - >-
        Coordinated the electroacoustic studio, supported student productions, and
        maintained analogue, digital, and live-electronics infrastructure.
      - >-
        Realised and supported electronic works for concerts and installations,
        including rehearsal, system setup, multichannel and spatial-audio playback,
        restoration, and stem mastering.
      - >-
        Developed tools spanning synthesis (*FFTimbre*), visualisation (*AudioSpylt*),
        and AI-assisted analysis across multiple repertoires.

  - dates: 2021–2022
    role: Research Associate
    org: University of Music FRANZ LISZT Weimar
    location: Weimar
    bullets:
      - Concurrent with the Researcher and Artistic Associate role at HMT Leipzig.
      - >-
        Developed and evaluated CAMAT research and teaching pilots with faculty and
        students, including workshops on computational score analysis.

career_context:
  dates: Family context
  text: >-
    I am married and have two children. Between 2018 and 2022, family responsibilities
    and COVID-19 restrictions reduced the time available for conference travel and
    public-facing artistic production. I nevertheless remained professionally active
    at HMT Leipzig and, from 2021 to 2022, in the CAMAT research appointment at HfM
    Weimar.

