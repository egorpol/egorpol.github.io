teaching:
  summary: >-
    More than twelve years of teaching across electroacoustic composition and production,
    popular and electronic music, computer-assisted analysis, digital humanities,
    and AI at HMT Leipzig (2013–2025) and HfM Weimar (since 2025), combining artistic
    practice with research-led technical instruction.
  summary_de: >-
    Mehr als zwölf Jahre Lehrerfahrung in elektroakustischer Komposition und Produktion,
    populärer und elektronischer Musik, computergestützter Analyse, Digital Humanities
    und AI an der HMT Leipzig (2013–2025) und der HfM Weimar (seit 2025); Verbindung
    von künstlerischer Praxis und forschungsnaher technischer Lehre.
  # Shown on the Teaching page only; not included in the generated PDF.
  supervision: >-
    My appointment at HfM Weimar is a full research position. There I supervise
    students working within the project, and the seminars I teach serve as a
    practical setting in which to test the methods and concepts the project develops.
    Earlier, at HMT Leipzig, I supervised electroacoustic composition projects and
    coordinated the electroacoustic studio, including student productions and
    live-electronics infrastructure.
  items:
    - term: WS 2026/27
      title: >-
        Von der digitalen Edition zur computergestützten Musikanalyse: Einführung in
        Musik-Encoding und Tools für die Notentextanalyse
