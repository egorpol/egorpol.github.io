mastering:
  summary: >-
    Mastering for the Ornithopter Records catalogue as part of the label’s founding
    team, and for releases by bands and underground artists from Leipzig and Berlin,
    alongside pre-mastering for Fabian Russ’s contribution to *Neue Meister: Live
    in Berlin* (Neue Meister / Berlin Classics / Edel:Kultur).
  summary_de: >-
    Mastering für den Katalog von Ornithopter Records als Mitglied des Gründungsteams
    des Labels und für Veröffentlichungen von Bands und Underground-Acts aus Leipzig
    und Berlin, dazu Pre-Mastering für Fabian Russ’ Beitrag zu *Neue Meister: Live
    in Berlin* (Neue Meister / Berlin Classics / Edel:Kultur).
  url: /works/#mastering

