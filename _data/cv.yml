# Homepage / projects short copy (kept aligned with CV facts)
homepage:
  tagline: >-
    I work in computational musicology and research software, drawing on composition
    and electroacoustic practice to build open tools for analysis, research, and teaching.
  current_work: >-
    At the University of Music FRANZ LISZT Weimar, I serve as scientific co-lead of
    the DFG project
    *Development of a Comprehensive Cloud-Based Toolbox for Music Score Analysis*
    (2025–2028) with project head Prof. Dr. Martin Pfleiderer. My role
    centres on scientific conception, research coordination, and technical delivery. We are building
    collaborative annotation, statistical modelling, and pattern-discovery workflows
    for MEI and MusicXML corpora through Jupyter4NFDI.
  highlights:
    - "2026 — Accepted workshop, *Computergestützte Musikanalyse in der Cloud*, GfM annual conference, Frankfurt am Main"
    - "2026 — Accepted poster, *CAMAT_v2: Cloud-Based Tools for Collaborative Music Score Analysis*, ICCCM26, Würzburg"
    - "2026 — Presented *Beyond the Black Box…*, InMusic26, Aalborg"
    - "2026 — Two chapters published in Routledge *Innovation in Music* volumes"

projects:
  - name: CAMAT
    url: https://analyse.hfm-weimar.de/doku.php?id=en:start
    blurb: >-
      Symbolic repertoire analysis with MEI/MusicXML, co-developed with
      Prof. Dr. Martin Pfleiderer and Christon-Ragavan Nadar.
    detail: >-
      Cloud-oriented toolbox for symbolic score analysis with MEI and MusicXML
      workflows — repertoire statistics, pattern discovery, and teaching transfer.
      Co-developed with Prof. Dr. Martin Pfleiderer and Christon-Ragavan Nadar;
      currently extended in the DFG cloud-toolbox project at HfM Weimar, secured
      together with Prof. Dr. Martin Pfleiderer.
  - name: AudioSpylt
    url: https://github.com/egorpol/audiospylt
    blurb: Audio feature extraction and interactive visualisation for analysis close to listening practice.
    detail: >-
      Python toolkit for audio feature extraction, interactive visualisation, and
      creative prototyping — analysis workflows that stay close to listening and
      studio practice.
  - name: FFTimbre
    url: https://github.com/egorpol/FFTimbre
    blurb: FM/additive timbre matching with multi-metric evaluation.
    detail: >-
      Notebooks and utilities for FM and additive-synthesis timbre matching, with
      multi-metric evaluation. Bridges analysis and synthesis for research and teaching.
  - name: beat_it
    url: https://github.com/egorpol/beat_it
    blurb: Beat and tempo fluctuation analysis across electroacoustic and electronic repertoires.
    detail: >-
      Research notebooks for analysing beat and tempo fluctuations from acousmatic
      music to electronic dance music.
