# Single source of truth for the web CV and the English and German PDFs.
# German PDF text goes in `<field>_de` keys next to the English ones; dates,
# names, and titles of works, releases, and projects are shared.
# Edit this file, then: ruby scripts/generate_cv_tex.rb --build
# and ruby scripts/generate_cv_tex.rb --lang de --build
# (--check lists German fields that are still missing)

name: Egor Polyakov
title: Curriculum Vitae
job_title: Postdoctoral Researcher in Computational Musicology
job_title_de: Wissenschaftlicher Mitarbeiter (Postdoc), Computational Musicology
affiliation: University of Music FRANZ LISZT Weimar

profile: >-
  Computational musicologist, producer, and research software developer, connecting
  studio practice with analytical methods. My work combines production, mastering,
  composition, and the artistic-technical realisation of concerts and installations
  with teaching, project supervision, and computer-assisted music analysis.
  Practice-based knowledge shapes my research tools and my teaching. I am currently
  responsible for research and development for the DFG-funded CAMAT project at HfM Weimar.
# The German profile is production-first; the English stays balanced.
profile_de: >-
  Produzent, Mastering-Engineer und Komponist, Musikwissenschaftler mit Schwerpunkt
  Computational Musicology und Entwickler von Forschungssoftware an der Schnittstelle
  von künstlerischer Praxis und analytischen Methoden. Meine Arbeit verbindet
  Produktion, Komposition und künstlerisch-technische Realisation mit Lehre,
  Projektbetreuung und computergestützter Musikanalyse. Praxiswissen prägt meine
  Forschungswerkzeuge und meine Lehre. Derzeit bin ich für Research & Development im
  DFG-geförderten Projekt CAMAT an der HfM Weimar verantwortlich.

note: >-
  Born in Bakhmut, Ukraine. Based in the Leipzig region, Germany.
  Publications may appear under the former transliteration “Poliakov”.
# The German CV has no career-context section; family status is this one line.
note_de: >-
  Geboren in Bachmut (Ukraine). Verheiratet, zwei Kinder. Wohnhaft im Raum Leipzig.
  Publikationen teils unter der früheren Transliteration „Poliakov“.

