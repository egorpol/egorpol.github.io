# Homepage / projects short copy (kept aligned with CV facts)
homepage:
  tagline: >-
    I am a computational musicologist, producer, and research software developer.
    My work grows out of a lifelong fascination with music, computers, and the
    unexpected things they can do together.
  motivation:
    - >-
      As a child, I was given a ZX Spectrum clone. I was amazed that one small
      machine could draw, calculate, run games, and even make music, however limited
      the sound was. Around the same time, I began learning piano and cello and
      discovered how much I enjoyed improvising and composing. For years, I followed
      that musical path meticulously and studied classical music almost exclusively.
    - >-
      The connection between those two worlds became clear only much later. What I
      have always enjoyed most is building a setup—musical, analytical, or
      technical—then trying it out and discovering an interaction I could not quite
      see before. Today that might mean turning a score into explorable data,
      translating a listening question into an experiment, or asking what a
      machine-learning model can—and cannot—understand about musical features. At
      heart, I do this work because I have fun doing it. Building accessible tools
      lets me share that experience with others.
  journey:
    - stage: The classical path
      text: >-
        Piano, cello, improvisation, and composition led me from childhood curiosity
        to formal studies. For years, I treated the classical tradition as the centre
        of my musical world.
    - stage: Beyond the academy
      text: >-
        Love Parade in 2002 and several open-air festivals in 2003–04 profoundly
        changed that view. Techno, drum and bass, dub, and other forms of popular
        electronic music made me question the idea of one “true” music.
    - stage: Programming music
      text: >-
        From around 2008–09, Max/MSP, OpenMusic, Pure Data, and related environments
        became central to how I worked. I built real-time audio systems, Max for Live
        devices, and analysis–synthesis setups for composition, performance, and
        teaching.
    - stage: Between worlds
      text: >-
        For years I composed contemporary concert music and minimal/techdub in parallel.
        Alongside my own music, I mastered the Ornithopter Records catalogue as part of
        its founding team and worked with Fabian Russ on concert and recording projects.
        Over time I came to see composition as one part of my work rather than the whole
        of it: producing, realising other people’s music, and building tools became more
        central.
    - stage: From real time to research
      text: >-
        My doctorate led me from accessible software and hybrid analysis systems
        towards MIR and computational musicology. As my focus moved away from
        real-time audio around 2020, Python gradually replaced patching environments;
        CAMAT in 2021–22 brought these threads together in open analytical tools and,
        later, machine learning.
  current_work:
    - >-
      At the University of Music FRANZ LISZT Weimar, I work on research and development
      for [CAMAT](https://github.com/analyse-hfm-weimar), the Computer-Assisted Music
      Analysis Toolbox. The DFG-funded project *Development of a Comprehensive Cloud-Based
      Toolbox for Music Score Analysis* runs from September 2025 to August 2028, with
      Prof. Dr. Martin Pfleiderer as principal investigator. We bring MEI, Python,
      and Jupyter notebooks into musicological research and teaching: editing and
      checking encodings, connecting notation to facsimiles, extracting musical
      events, and exploring patterns in scores. Jupyter4NFDI makes these tools
      accessible through a browser.
    - >-
      The editorial work is part of this, too. In the CAMAT editions, we correct
      and review optical music recognition from the Bavarian State Library and
      musiconn.scoresearch, turning it into usable MEI editions and research corpora.
      Current work draws on *Denkmäler deutscher Tonkunst* (DdT):
      [volume I/11, *Dietrich Buxtehudes Instrumentalwerke*](https://github.com/egorpol/DdT_1_vol_11),
      and [volumes I/29–30, *Instrumentalkonzerte deutscher Meister*](https://github.com/egorpol/DdT_1_vol_29_30).
    - >-
      For me, building analytical software and working carefully with the sources
      belong together. An encoding, explicitly linked back to the facsimile, should
      offer another way into the source, not replace it or hide the editorial choices
      made along the way. Whatever we choose to encode, it should remain possible to
      return to the source and question that reading.
  studio:
    - >-
      Alongside research, I have spent much of my working life in the studio. As one
      half of Two Unknown Guys, I produced minimal and techdub tracks released on
      [Ornithopter Records](/works/swirl-planet/) and
      [Sinergy Networks](/works/rubber-duck-massacre/). As part of Ornithopter’s
      founding team, I mastered the label’s catalogue, and later releases by bands
      and underground artists from Leipzig and Berlin.
    - >-
      For concerts and installations, I realised live electronics and stem mastering,
      most closely with Fabian Russ: premieres at Futurium Berlin, Montforthaus
      Feldkirch, and Scala Esslingen, several of them interdisciplinary productions
      with dance, theatre, and video.
  accessibility:
    - >-
      I do not think access to music or musical analysis should depend on proprietary
      software or expensive hardware. Accessibility is a design requirement in my
      work: I release my tools as open source and keep their methods, assumptions, and
      workflows inspectable, reproducible, and adaptable.
    - >-
      Reproducibility also concerns the medium itself. I want people to be able to
      experience or study music with whatever is available: a sophisticated studio
      system, inexpensive headphones, a small loudspeaker, or even a visual or
      analytical representation. Music organises time; sound is one way of
      encountering that organisation, but not the only one.
  # Exactly four items: the Pixel-view highlight patch is laid out for four.
  highlights:
    - "2026 — Presented poster “CAMAT_v2: Cloud-Based Tools for Collaborative Music Score Analysis”, ICCCM26, Würzburg"
    - "2026 — Presented “Beyond the Black Box…”, InMusic26, Aalborg"
    - "2026 — Published chapter on FFTimbre in Routledge *Innovation in Music: Current Research Perspectives*"
    - "In press — Chapter on the beat_it toolbox in Routledge *Innovation in Music: Sound and Place*"

projects:
  - name: CAMAT
    url: https://github.com/analyse-hfm-weimar
    blurb: >-
      MEI editing, facsimile-linked editions, and computational music analysis
      with Python and Jupyter notebooks.
    detail: >-
      The Computer-Assisted Music Analysis Toolbox brings MEI, Python, and
      Jupyter notebooks into musicological research and teaching. It connects
      score editing and facsimiles with note and event tables, piano-roll
      visualisations, and searches for motifs, chord progressions, and textures.
      Notebook workflows retain links to the source notation and can also run
      in the browser through Jupyter4NFDI.
  - name: AudioSpylt
    url: https://github.com/egorpol/audiospylt
    blurb: Python audio analysis, signal processing, and interactive visualization, inspired by AudioSculpt and OpenMusic.
    detail: >-
      AudioSpylt is a Python toolbox, inspired by AudioSculpt and OpenMusic,
      built for in-depth audio analysis, advanced signal processing, and
      interactive visualization.
  - name: FFTimbre
    url: https://github.com/egorpol/FFTimbre
    blurb: FM/additive timbre matching with multi-metric evaluation.
    detail: >-
      Notebooks and utilities for FM and additive-synthesis timbre matching, with
      multi-metric evaluation. Bridges analysis and synthesis for research and teaching.
  - name: beat_it
    url: https://github.com/egorpol/beat_it
    blurb: Beat and tempo fluctuation analysis across electroacoustic and electronic repertoires.
    detail: >-
      Research notebooks for analysing beat and tempo fluctuations from acousmatic
      music to electronic dance music.
  - name: eu-pd-composers
    url: https://egorpol.github.io/eu-pd-composers/
    blurb: EU public-domain estimates for 20th-century composers, linked to their works on IMSLP.
    detail: >-
      A versioned dataset and static browser for finding 20th-century classical
      composers whose music is likely in the public domain in the EU (life plus
      70 years). It covers 3,369 composers and 29,033 of their works on IMSLP,
      drawn from Wikipedia, Wikidata, and IMSLP, and every label records its
      source. Releases are archived on Zenodo; the estimate is a heuristic, not
      legal advice.
