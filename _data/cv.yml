experience:
  - dates: 2025–present
    role: Postdoctoral Researcher
    role_de: Wissenschaftlicher Mitarbeiter (Postdoc)
    org: University of Music FRANZ LISZT Weimar
    org_de: Hochschule für Musik FRANZ LISZT Weimar
    location: Weimar
    bullets:
      - >-
        Research and development for the DFG project
        *Development of a Comprehensive Cloud-Based Toolbox for Music Score Analysis*,
        alongside project head Prof. Dr. Martin Pfleiderer; responsible for scientific
        conception and research execution. Co-applicant; total funding: €443,458.
      - >-
        Coordinate the research programme and supervise student
        assistants across technical and scholarly work packages.
      - >-
        Develop Python workflows for MEI/MusicXML analysis, extend mei-friend for
        OMR corpora (musiconn / *Denkmäler deutscher Tonkunst*), and deliver
        interactive score workflows through MEI, Verovio, and Jupyter4NFDI.
      - Integrate project methods into national research infrastructure and university teaching.
    bullets_de:
      - >-
        Research & Development im DFG-Projekt *Development of a Comprehensive
        Cloud-Based Toolbox for Music Score Analysis* mit Projektleiter Prof. Dr.
        Martin Pfleiderer; verantwortlich für wissenschaftliche Konzeption und
        Durchführung. Mitantragsteller; Fördersumme: 443.458 Euro.
      - >-
        Koordination des Forschungsprogramms und Anleitung studentischer Hilfskräfte
        in technischen und wissenschaftlichen Arbeitspaketen.
      - >-
        Entwicklung von Python-Workflows für die MEI/MusicXML-Analyse, Erweiterung von
        mei-friend für OMR-Korpora (musiconn / *Denkmäler deutscher Tonkunst*) sowie
        interaktive Notentext-Workflows mit MEI, Verovio und Jupyter4NFDI.
      - Integration der Projektmethoden in die nationale Forschungsinfrastruktur und die Hochschullehre.

  - dates: 2013–2025
    role: Researcher and Artistic Associate
    role_de: Wissenschaftlicher und künstlerischer Mitarbeiter
    org: University of Music and Theatre Leipzig
    org_de: Hochschule für Musik und Theater „Felix Mendelssohn Bartholdy“ Leipzig
    location: Leipzig
    bullets:
      - >-
        Designed and taught courses in electroacoustics, popular and electronic
        music, computer-assisted analysis, and AI for musicology; supervised
        electroacoustic composition projects.
      - >-
        Supported student productions and realisations artistically and technically,
        from recording and sound processing to live electronics, video, sensors, and
        controller integration.
      - >-
        Coordinated the electroacoustic studio and maintained its analogue, digital,
        and live-electronics infrastructure.
      - >-
        Realised and supported electronic works for concerts and installations,
        including rehearsal, system setup, multichannel and spatial-audio playback,
        restoration, and stem mastering.
      - >-
        Developed tools spanning synthesis (FFTimbre), visualisation (AudioSpylt),
        and AI-assisted analysis across multiple repertoires.
    bullets_de:
      - >-
        Konzeption und Durchführung von Lehrveranstaltungen zu Elektroakustik,
        populärer und elektronischer Musik, computergestützter Analyse und AI in der
        Musikwissenschaft; Betreuung elektroakustischer Kompositionsprojekte.
      - >-
        Künstlerisch-technische Betreuung studentischer Produktionen und
        Realisationen – von Recording und Klangbearbeitung bis zu Live-Elektronik,
        Video, Sensorik und Controller-Anbindung.
      - >-
        Koordination des elektroakustischen Studios und Pflege der analogen, digitalen
        und live-elektronischen Studiotechnik.
      - >-
        Realisation und Betreuung elektronischer Werke für Konzerte und Installationen,
        einschließlich Einstudierung, Systemaufbau, Mehrkanal- und
        Raumklangwiedergabe, Restaurierung und Stem-Mastering.
      - >-
        Entwicklung von Werkzeugen für Synthese (FFTimbre), Visualisierung (AudioSpylt)
        und AI-gestützte Analyse für verschiedene Repertoires.

