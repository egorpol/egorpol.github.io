name: Egor Polyakov
title: Curriculum Vitae
job_title: Postdoctoral Researcher in Computational Musicology
affiliation: University of Music FRANZ LISZT Weimar

profile: >-
  Composer, computational musicologist, and research software developer connecting
  creative practice with analytical methods. My work has grown from electroacoustic
  composition, synthesis, interactive systems, studio teaching, and the realisation
  of concert and installation works into Python-based music encoding, audio and score
  analysis, and AI. Rather than treating creative and analytical work as separate
  specialisms, I use practice-based knowledge to shape research tools and teaching.
  I currently serve as scientific co-lead of a DFG-funded project at HfM Weimar.

note: >-
  Born in Bakhmut, Ukraine. Based in the Leipzig region, Germany.
  Publications may appear under the former transliteration “Poliakov.”

