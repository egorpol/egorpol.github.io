{% comment %}
  16×16 pixel-circle furniture for the header toggles. Kept in a sprite so the
  two buttons share one ring. Must not be `display: none` or <use> will fail.
{% endcomment %}
<svg class="pixel-toggle-defs" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
  <symbol id="px-disc" viewBox="0 0 16 16">
    {% include px-rects.html runs="6,0,4 4,1,8 3,2,10 2,3,12 1,4,14 1,5,14 0,6,16 0,7,16 0,8,16 0,9,16 1,10,14 1,11,14 2,12,12 3,13,10 4,14,8 6,15,4" %}
  </symbol>
  <symbol id="px-ring" viewBox="0 0 16 16">
    {% include px-rects.html runs="6,0,4 4,1,8 3,2,3 10,2,3 2,3,2 12,3,2 1,4,2 13,4,2 1,5,2 13,5,2 0,6,2 14,6,2 0,7,2 14,7,2 0,8,2 14,8,2 0,9,2 14,9,2 1,10,2 13,10,2 1,11,2 13,11,2 2,12,2 12,12,2 3,13,3 10,13,3 4,14,8 6,15,4" %}
  </symbol>
  <symbol id="px-tip" viewBox="0 0 16 16">
    {% include px-rects.html runs="6,5,4 5,6,6 5,7,6 5,8,6 6,9,4" %}
  </symbol>
</svg>
