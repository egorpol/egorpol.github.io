---
layout: default
---
<article>
    <header class="post-header">
        <p class="eyebrow">Note</p>
        <h1>{{ page.title }}</h1>
        <p class="post-meta"><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%-d %B %Y" }}</time></p>
        {% if page.tags %}
        <p class="note-tags">{% for tag in page.tags %}<span>{{ tag }}</span>{% endfor %}</p>
        {% endif %}
    </header>

    <div class="post-body">
        {{ content }}
    </div>

    <footer class="post-footer">
        <a class="text-link" href="{{ '/notes/' | relative_url }}"><span aria-hidden="true">←</span> All notes</a>
    </footer>
</article>
