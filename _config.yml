# Site settings. Restart `jekyll serve` after editing; this file is not reloaded.

title: Egor Polyakov
tagline: Computational musicologist, producer, and research software developer
email: egor.polyakov@hfm-weimar.de
description: Computational musicology, music production and mastering, and open research software. Postdoctoral researcher at HfM Weimar.
author: Egor Polyakov
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://egorpol.github.io" # the base hostname & protocol for your site
github_username: egorpol
lang: en
locale: en_GB # og:locale, set by jekyll-seo-tag
timezone: Europe/Berlin
permalink: /notes/:year/:month/:day/:title


markdown: kramdown

kramdown:
  input: GFM
  syntax_highlighter: rouge

sass:
  sass_dir: _sass
  style: compressed

# GitHub Pages only runs plugins listed here.
plugins:
  - jekyll-feed
  - jekyll-seo-tag

logo: /assets/images/avatar.jpg
social:
  name: Egor Polyakov
  links:
    - https://orcid.org/0000-0003-0913-0429
    - https://github.com/egorpol
    - https://www.linkedin.com/in/egor-polyakov-6a2114315/
    - https://egorpol.github.io
orcid: https://orcid.org/0000-0003-0913-0429

feed:
  path: /notes/feed.xml

# Collections
collections:
  posts:
    output: true
    permalink: /notes/:year/:month/:day/:title/

# Landscape card used for link previews; pages may override with their own image.
defaults:
  - scope:
      path: ""
    values:
      image: /assets/images/og-card.png

# Exclude from processing.
# The following items will not be processed, by default.
# Any item listed under the `exclude:` key here will be automatically added to
# the internal "default list".
#
# Excluded items can be processed by explicitly listing the directories or
# their entries' file path in the `include:` list.
#
exclude:
  - dresden-bewerbung/
  - private/
  # Raw material for future Works pages; see assets/audio/README.md.
  - "assets/audio/* ([0-9][0-9][0-9][0-9])"
  - assets/audio/swirl-planet/*.wav
  - assets/audio/swirl-planet/*.pkf
  # Original sources and editing sidecars stay local.
  - assets/audio/dd-demo/comp_swirl_cut.aif
  - assets/audio/dd-demo/comp_manuals_cut.aif
  - assets/audio/dd-demo/comp_st2_cut.aif
  - assets/audio/dd-demo/comp_double_cut.aiff
  - assets/audio/dd-demo/mast_or009_cut.aif
  - assets/audio/dd-demo/mast_shandy_cut.aif
  - assets/audio/dd-demo/mast_color_cut.aiff
  - assets/audio/dd-demo/5 Audio Track.aiff
  - assets/audio/dd-demo/mast_or002_cut.aif
  - assets/audio/dd-demo/*.wav
  - assets/audio/dd-demo/*.pkf
  - assets/audio/dd-demo/*.zip
  - assets/audio/dd-demo/01_adada-dd.mp3
  - assets/audio/dd-demo/SHANDY MANDIES - Baby Blue [1366364827].mp3
  - _site/
  - cv/
  - scripts/
  - vendor/
  # Contributor docs; the font licence beside it must stay published (OFL).
  - assets/audio/README.md
  - CHANGELOG.md
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - POST_TEMPLATE.md
  - README.md
