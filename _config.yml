# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.
#
# If you need help with YAML syntax, here are some quick references for you:
# https://learn-the-web.algonquindesign.ca/topics/markdown-yaml-cheat-sheet/#yaml
# https://learnxinyminutes.com/docs/yaml/
#
# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.

title: Egor Polyakov
tagline: Postdoctoral researcher in computational musicology
email: egor.polyakov@hfm-weimar.de
description: Postdoctoral researcher in computational musicology at HfM Weimar.
author: Egor Polyakov
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://egorpol.github.io" # the base hostname & protocol for your site
github_username: egorpol
lang: en
timezone: Europe/Berlin
permalink: /notes/:year/:month/:day/:title


markdown: kramdown

kramdown:
  input: GFM
  syntax_highlighter: rouge

sass:
  sass_dir: _sass
  style: compressed

# Build settings
# theme: minima

plugins:
  - jekyll-seo-tag

logo: /assets/images/avatar.jpg
social:
  name: Egor Polyakov
  links:
    - https://orcid.org/0000-0003-0913-0429
    - https://github.com/egorpol
    - https://www.linkedin.com/in/egor-polyakov-6a2114315/
    - https://egorpol.github.io
orcid: https://orcid.org/0000-0003-0913-0429

# SEO settings
# google_analytics: G-XXXXXXXXXX  # Uncomment and replace with your actual GA4 measurement ID
# google_analytics_anonymize_ip: true
# gtag: G-XXXXXXXXXX

# Open Graph settings
# twitter:
#   username: egorpol  # Uncomment if you create a Twitter/X account
#   card: summary_large_image

# Pagination (disabled; enable if you add paginated blog index)
# paginate: 5
# paginate_path: "/blog/page:num/"

feed:
  path: /notes/feed.xml

# Collections
collections:
  posts:
    output: true
    permalink: /notes/:year/:month/:day/:title/

# Landscape card used for link previews; pages may override with their own image.
defaults:
  - scope:
      path: ""
    values:
      image: /assets/images/og-card.png

# Exclude from processing.
# The following items will not be processed, by default.
# Any item listed under the `exclude:` key here will be automatically added to
# the internal "default list".
#
# Excluded items can be processed by explicitly listing the directories or
# their entries' file path in the `include:` list.
#
exclude:
  - _site/
  - cv/
  - scripts/
  - vendor/
  # Contributor docs; the font licence beside it must stay published (OFL).
  - assets/audio/README.md
  - CHANGELOG.md
  - CATEGORIES.md
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - POST_TEMPLATE.md
  - README.md
